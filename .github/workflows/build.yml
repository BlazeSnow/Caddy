name: Build and Publish Caddy Plugins

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建所有插件镜像，忽略版本缓存。'
        type: boolean
        default: false
  schedule:
  - cron: "0 17 * * *"

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_ALPINE: public.ecr.aws/docker/library/alpine:3.24
  BASE_DEBIAN: public.ecr.aws/docker/library/debian:trixie-slim
  # 静态基础镜像（base job 构建，只推 GHCR）；tag 后半段与上方 BASE_ALPINE/BASE_DEBIAN 保持一致
  BASE_IMAGE_REPO: ghcr.io/blazesnow/caddy-base
  BASE_TAG_ALPINE: alpine-3.24
  BASE_TAG_DEBIAN: debian-trixie-slim
  # beta 模式：dev 分支，或推送 vX.Y.Z-beta.N 预发布 tag
  BASE_TAG_SUFFIX: ${{ (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta'))) && '-beta' || '' }}
  IMAGE_PREFIX: ${{ (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta'))) && 'blazesnow/caddy-beta' || 'blazesnow/caddy' }}
  GHCR_IMAGE_PREFIX: ${{ (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta'))) && 'ghcr.io/blazesnow/caddy-beta' || 'ghcr.io/blazesnow/caddy' }}
  CACHE_NS: ${{ (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta'))) && 'beta-' || '' }}
  # beta 模式标志（dev 分支或 v*-beta* tag），供 build job 决定版本 label
  BETA: ${{ github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta')) }}
  # beta 模式（dev 分支手动触发）只构建这些插件，用于快速验证
  BETA_PLUGINS: cloudflare tencentcloud webdav

jobs:
  versions:
    runs-on: ubuntu-latest

    outputs:
      caddy: ${{ steps.caddy.outputs.caddy }}
      matrix: ${{ steps.versions.outputs.matrix }}
      all_versions: ${{ steps.versions.outputs.all_versions }}
      base_changed: ${{ steps.versions.outputs.base_changed }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up golang
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: false

    - name: Get Caddy version
      id: caddy
      run: echo "caddy=$(go list -m -json github.com/caddyserver/caddy/v2@latest | jq -r '.Version')" >> "$GITHUB_OUTPUT"

    - name: Restore build manifest
      id: manifest-cache
      uses: actions/cache/restore@v6
      with:
        path: .build-cache/manifest.json
        key: build-manifest-${{ env.CACHE_NS }}${{ steps.caddy.outputs.caddy }}
        restore-keys: |
          build-manifest-${{ env.CACHE_NS }}${{ steps.caddy.outputs.caddy }}-

    - name: Get plugin versions and build matrix
      id: versions
      env:
        FORCE_BUILD: ${{ github.event.inputs.force_build }}
      run: bash versions.sh

  # 静态基础镜像：依赖/Caddyfile/环境变量等固定层，只推 GHCR（ghcr.io/blazesnow/caddy-base）。
  # 上游基础镜像 digest 变化（base_changed）、强制构建或镜像缺失时重建；
  # 插件 job 的 Dockerfile 从它 FROM，不再重复执行 apk/apt 等步骤。
  base:
    runs-on: ubuntu-latest
    needs: versions

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Login to GitHub
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if base image needs rebuild
      id: check
      env:
        BASE_CHANGED: ${{ needs.versions.outputs.base_changed }}
        FORCE_BUILD: ${{ github.event.inputs.force_build }}
      run: bash check-base.sh

    - name: Set up QEMU
      if: steps.check.outputs.needed == 'true'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: steps.check.outputs.needed == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Build and push base image (Alpine)
      if: steps.check.outputs.needed == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.base
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_ALPINE }}
        tags: |
          ${{ env.BASE_IMAGE_REPO }}:${{ env.BASE_TAG_ALPINE }}${{ env.BASE_TAG_SUFFIX }}

    - name: Build and push base image (Debian)
      if: steps.check.outputs.needed == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.base
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_DEBIAN }}
        tags: |
          ${{ env.BASE_IMAGE_REPO }}:${{ env.BASE_TAG_DEBIAN }}${{ env.BASE_TAG_SUFFIX }}

  build:
    runs-on: ubuntu-latest
    needs: [versions, base]
    if: needs.versions.outputs.matrix != '[]'

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up golang
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: false

    - name: Set versions
      run: |
        echo "CADDY_VERSION=${{ needs.versions.outputs.caddy }}" >> "$GITHUB_ENV"
        echo "PLUGIN_VERSION=${{ matrix.plugin_version }}" >> "$GITHUB_ENV"
        if [ "${{ env.BETA }}" = "true" ]; then
          # beta 镜像不携带正式版版本号：tag 触发用 tag 名（如 1.4.4-beta.1），dev 分支为 dev
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=dev" >> "$GITHUB_ENV"
          fi
        else
          echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
        fi

    - name: Set Go version
      id: gover
      run: echo "version=$(go env GOVERSION)" >>"$GITHUB_OUTPUT"

    - name: Restore Go modules cache
      id: go-mod-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ env.CADDY_VERSION }}

    - name: Restore Go build cache
      id: go-build-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/go-build
        key: go-build-${{ env.CADDY_VERSION }}-${{ steps.gover.outputs.version }}

    - name: Install xcaddy
      run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

    - name: Build Caddy binaries
      env:
        PLUGIN: ${{ matrix.context }}
      run: bash build-caddy.sh

    - name: Save Go modules cache
      if: steps.go-mod-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ env.CADDY_VERSION }}

    - name: Save Go build cache
      if: steps.go-build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/go-build
        key: go-build-${{ env.CADDY_VERSION }}-${{ steps.gover.outputs.version }}

    - name: Login to Docker Hub
      uses: docker/login-action@v4.5.2
      with:
        username: blazesnow
        password: ${{ secrets.TOKEN }}

    - name: Login to GitHub
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push (Alpine)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_IMAGE_REPO }}:${{ env.BASE_TAG_ALPINE }}${{ env.BASE_TAG_SUFFIX }}
          VERSION=${{ env.APP_VERSION }}
        tags: |
          ${{ env.IMAGE_PREFIX }}:${{ matrix.name }}-alpine
          ${{ env.IMAGE_PREFIX }}:${{ matrix.name }}
          ${{ env.GHCR_IMAGE_PREFIX }}:${{ matrix.name }}-alpine
          ${{ env.GHCR_IMAGE_PREFIX }}:${{ matrix.name }}

    - name: Build and push (Debian)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_IMAGE_REPO }}:${{ env.BASE_TAG_DEBIAN }}${{ env.BASE_TAG_SUFFIX }}
          VERSION=${{ env.APP_VERSION }}
        tags: |
          ${{ env.IMAGE_PREFIX }}:${{ matrix.name }}-slim
          ${{ env.GHCR_IMAGE_PREFIX }}:${{ matrix.name }}-slim

  finalize:
    runs-on: ubuntu-latest
    needs: [versions, build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Write build manifest
      env:
        ALL_VERSIONS: ${{ needs.versions.outputs.all_versions }}
      run: bash write-manifest.sh

    - name: Save build manifest
      uses: actions/cache/save@v6
      with:
        path: .build-cache/manifest.json
        key: build-manifest-${{ env.CACHE_NS }}${{ needs.versions.outputs.caddy }}-${{ github.run_id }}
