name: Build and Publish Caddy Plugins

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建所有插件镜像，忽略版本缓存。'
        required: true
        default: 'false'
  schedule:
  - cron: "0 17 * * *"

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_ALPINE: public.ecr.aws/docker/library/alpine:3.24
  BASE_DEBIAN: public.ecr.aws/docker/library/debian:trixie-slim

jobs:
  versions:
    runs-on: ubuntu-latest

    outputs:
      caddy: ${{ steps.caddy.outputs.caddy }}
      matrix: ${{ steps.versions.outputs.matrix }}
      all_versions: ${{ steps.versions.outputs.all_versions }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up golang
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: false

    - name: Get Caddy version
      id: caddy
      run: echo "caddy=$(go list -m -json github.com/caddyserver/caddy/v2@latest | jq -r '.Version')" >> "$GITHUB_OUTPUT"

    - name: Restore build manifest
      id: manifest-cache
      uses: actions/cache/restore@v6
      with:
        path: .build-cache/manifest.json
        key: build-manifest-${{ steps.caddy.outputs.caddy }}
        restore-keys: |
          build-manifest-${{ steps.caddy.outputs.caddy }}-

    - name: Get plugin versions and build matrix
      id: versions
      run: |
        set -eu

        jq -e 'type == "array" and length > 0' plugins.json > /dev/null || {
          echo "::error::plugins.json 无效或为空"
          exit 1
        }

        FORCE="false"
        if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
          FORCE="true"
        fi

        MANIFEST="{}"
        if [ -f .build-cache/manifest.json ]; then
          MANIFEST=$(cat .build-cache/manifest.json)
        fi

        # 基础镜像指纹：pin 的 tag 当前内容（patch 更新时变化）
        ALPINE_FP=$(curl -sf "https://hub.docker.com/v2/repositories/library/alpine/tags/${BASE_ALPINE##*:}" | jq -c '[.images[].digest] | sort') || ALPINE_FP="unknown"
        DEBIAN_FP=$(curl -sf "https://hub.docker.com/v2/repositories/library/debian/tags/${BASE_DEBIAN##*:}" | jq -c '[.images[].digest] | sort') || DEBIAN_FP="unknown"

        BASE_CHANGED="false"
        if [ "$(printf '%s' "$MANIFEST" | jq -r '.base_alpine // "none"')" != "$ALPINE_FP" ] || \
           [ "$(printf '%s' "$MANIFEST" | jq -r '.base_debian // "none"')" != "$DEBIAN_FP" ]; then
          BASE_CHANGED="true"
        fi

        MATRIX='[]'
        ALL='{}'
        while IFS= read -r entry; do
          name=$(jq -r '.name' <<< "$entry")
          context=$(jq -r '.context' <<< "$entry")
          plugin_version=$(go list -m -json "${context}@latest" | jq -r '.Version')

          ALL=$(printf '%s' "$ALL" | jq -c --arg name "$name" --arg plugin_version "$plugin_version" \
            '. + {($name): $plugin_version}')

          last_built=$(printf '%s' "$MANIFEST" | jq -r --arg name "$name" '.[$name] // "none"')
          if [ "$FORCE" = "true" ] || [ "$BASE_CHANGED" = "true" ] || [ "$last_built" != "$plugin_version" ]; then
            MATRIX=$(printf '%s' "$MATRIX" | jq -c \
              --arg name "$name" --arg context "$context" --arg plugin_version "$plugin_version" \
              '. + [{name: $name, context: $context, plugin_version: $plugin_version}]')
          fi
        done < <(jq -c '.[]' plugins.json)

        ALL=$(printf '%s' "$ALL" | jq -c --arg base_alpine "$ALPINE_FP" --arg base_debian "$DEBIAN_FP" \
          '. + {base_alpine: $base_alpine, base_debian: $base_debian}')

        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
        echo "all_versions=$ALL" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.matrix != '[]'

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up golang
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: false

    - name: Set versions
      run: |
        echo "CADDY_VERSION=${{ needs.versions.outputs.caddy }}" >> "$GITHUB_ENV"
        echo "PLUGIN_VERSION=${{ matrix.plugin_version }}" >> "$GITHUB_ENV"

    - name: Install xcaddy
      run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

    - name: Build Caddy binaries
      env:
        PLUGIN: ${{ matrix.context }}
      run: |
        set -eu

        mkdir -p dist/linux_amd64 dist/linux_arm64

        for arch in amd64 arm64 ; do
          echo "构建 Caddy ${CADDY_VERSION} + ${PLUGIN}@${PLUGIN_VERSION} for linux/${arch}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${arch} xcaddy build "${CADDY_VERSION}" \
            --with "${PLUGIN}@${PLUGIN_VERSION}" \
            --output "dist/linux_${arch}/caddy"
          chmod +x "dist/linux_${arch}/caddy"
        done

    - name: Login to Docker Hub
      uses: docker/login-action@v4.5.2
      with:
        username: blazesnow
        password: ${{ secrets.TOKEN }}

    - name: Login to GitHub
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push (Alpine)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_ALPINE }}
        tags: |
          blazesnow/caddy:${{ matrix.name }}-alpine
          blazesnow/caddy:${{ matrix.name }}
          ghcr.io/blazesnow/caddy:${{ matrix.name }}-alpine
          ghcr.io/blazesnow/caddy:${{ matrix.name }}

    - name: Build and push (Debian)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_DEBIAN }}
        tags: |
          blazesnow/caddy:${{ matrix.name }}-slim
          ghcr.io/blazesnow/caddy:${{ matrix.name }}-slim

  finalize:
    runs-on: ubuntu-latest
    needs: [versions, build]

    steps:
    - name: Write build manifest
      run: |
        mkdir -p .build-cache
        echo '${{ needs.versions.outputs.all_versions }}' > .build-cache/manifest.json

    - name: Save build manifest
      uses: actions/cache/save@v6
      with:
        path: .build-cache/manifest.json
        key: build-manifest-${{ needs.versions.outputs.caddy }}-${{ github.run_id }}
