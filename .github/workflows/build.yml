name: Build and Publish Caddy Plugins

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建所有插件镜像，忽略版本缓存。'
        required: true
        default: 'false'
  schedule:
  - cron: "0 17 * * *"

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest

    outputs:
      caddy: ${{ steps.versions.outputs.caddy }}
      matrix: ${{ steps.versions.outputs.matrix }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up golang
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: false

    - name: Get versions and build matrix
      id: versions
      run: |
        set -eu

        jq -e 'type == "array" and length > 0' plugins.json > /dev/null || {
          echo "::error::plugins.json 无效或为空"
          exit 1
        }

        CADDY_VERSION=$(go list -m -json github.com/caddyserver/caddy/v2@latest | jq -r '.Version')
        echo "caddy=$CADDY_VERSION" >> "$GITHUB_OUTPUT"

        MATRIX='[]'
        while IFS= read -r entry; do
          name=$(jq -r '.name' <<< "$entry")
          context=$(jq -r '.context' <<< "$entry")
          plugin_version=$(go list -m -json "${context}@latest" | jq -r '.Version')
          MATRIX=$(printf '%s' "$MATRIX" | jq -c \
            --arg name "$name" --arg context "$context" --arg plugin_version "$plugin_version" \
            '. + [{name: $name, context: $context, plugin_version: $plugin_version}]')
        done < <(jq -c '.[]' plugins.json)
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: versions

    env:
      BASE_ALPINE: public.ecr.aws/docker/library/alpine:3.24
      BASE_DEBIAN: public.ecr.aws/docker/library/debian:trixie-slim

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up golang
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: false

    - name: Set versions
      run: |
        echo "CADDY_VERSION=${{ needs.versions.outputs.caddy }}" >> "$GITHUB_ENV"
        echo "PLUGIN_VERSION=${{ matrix.plugin_version }}" >> "$GITHUB_ENV"

    - name: Restore build marker
      id: caddy-cache
      uses: actions/cache/restore@v6
      with:
        path: .build-cache/${{ matrix.name }}/caddy
        key: caddy-${{ matrix.name }}-${{ env.CADDY_VERSION }}

    - name: Restore plugin marker
      id: plugin-cache
      uses: actions/cache/restore@v6
      with:
        path: .build-cache/${{ matrix.name }}/plugin
        key: caddy-${{ matrix.name }}-plugin-${{ env.PLUGIN_VERSION }}

    - name: Check if build needed
      run: |
        echo "Caddy 版本：${{ env.CADDY_VERSION }}"
        echo "插件版本：${{ env.PLUGIN_VERSION }}"
        echo "Caddy 缓存命中：${{ steps.caddy-cache.outputs.cache-hit }}"
        echo "插件缓存命中：${{ steps.plugin-cache.outputs.cache-hit }}"

        if [ "${{ github.event.inputs.force_build }}" = "true" ] ; then
          echo "强制构建"
          echo "should_build=true" >> $GITHUB_ENV
        elif [ "${{ steps.caddy-cache.outputs.cache-hit }}" = "true" ] && [ "${{ steps.plugin-cache.outputs.cache-hit }}" = "true" ] ; then
          echo "跳过构建"
          echo "should_build=false" >> $GITHUB_ENV
        else
          echo "需要构建"
          echo "should_build=true" >> $GITHUB_ENV
        fi

    - name: Install xcaddy
      if: env.should_build == 'true'
      run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

    - name: Build Caddy binaries
      if: env.should_build == 'true'
      env:
        PLUGIN: ${{ matrix.context }}
      run: |
        set -eu

        mkdir -p dist/linux_amd64 dist/linux_arm64

        for arch in amd64 arm64 ; do
          echo "构建 Caddy ${CADDY_VERSION} + ${PLUGIN}@${PLUGIN_VERSION} for linux/${arch}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${arch} xcaddy build "${CADDY_VERSION}" \
            --with "${PLUGIN}@${PLUGIN_VERSION}" \
            --output "dist/linux_${arch}/caddy"
          chmod +x "dist/linux_${arch}/caddy"
        done

    - name: Login to Docker Hub
      if: env.should_build == 'true'
      uses: docker/login-action@v4.5.2
      with:
        username: blazesnow
        password: ${{ secrets.TOKEN }}

    - name: Login to GitHub
      if: env.should_build == 'true'
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      if: env.should_build == 'true'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: env.should_build == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Build and push (Alpine)
      if: env.should_build == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_ALPINE }}
        tags: |
          blazesnow/caddy:${{ matrix.name }}-alpine
          blazesnow/caddy:${{ matrix.name }}
          ghcr.io/blazesnow/caddy:${{ matrix.name }}-alpine
          ghcr.io/blazesnow/caddy:${{ matrix.name }}

    - name: Build and push (Debian)
      if: env.should_build == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=${{ env.BASE_DEBIAN }}
        tags: |
          blazesnow/caddy:${{ matrix.name }}-slim
          ghcr.io/blazesnow/caddy:${{ matrix.name }}-slim

    - name: Create build marker
      if: env.should_build == 'true'
      run: |
        mkdir -p .build-cache/${{ matrix.name }}/caddy .build-cache/${{ matrix.name }}/plugin
        echo "${{ env.CADDY_VERSION }}" > .build-cache/${{ matrix.name }}/caddy/version
        echo "${{ env.PLUGIN_VERSION }}" > .build-cache/${{ matrix.name }}/plugin/version

    - name: Save Caddy marker
      if: env.should_build == 'true' && steps.caddy-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .build-cache/${{ matrix.name }}/caddy
        key: caddy-${{ matrix.name }}-${{ env.CADDY_VERSION }}

    - name: Save plugin marker
      if: env.should_build == 'true' && steps.plugin-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .build-cache/${{ matrix.name }}/plugin
        key: caddy-${{ matrix.name }}-plugin-${{ env.PLUGIN_VERSION }}
