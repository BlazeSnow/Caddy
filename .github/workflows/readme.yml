name: Sync README to Docker Hub

on:
  push:
    branches:
    - main
    - dev
    paths:
    - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Sync README to Docker Hub
      env:
        DOCKER_USER: blazesnow
        DOCKER_TOKEN: ${{ secrets.TOKEN }}
        REPO: ${{ github.ref == 'refs/heads/dev' && 'blazesnow/caddy-beta' || 'blazesnow/caddy' }}
      run: bash sync-readme.sh
